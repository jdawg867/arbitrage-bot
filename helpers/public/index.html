<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arbitrage Bot — Stats</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --plane: #f9f9f7;
    --text-1: #0b0b0b;
    --text-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series: #2a78d6;
    --series-soft: rgba(42, 120, 214, 0.14);
    --good: #006300;
    --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --plane: #0d0d0d;
      --text-1: #ffffff;
      --text-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series: #3987e5;
      --series-soft: rgba(57, 135, 229, 0.18);
      --good: #0ca30c;
      --bad: #d03b3b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-1);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .sub .dot { margin: 0 6px; }
  a.btn {
    color: var(--text-1); text-decoration: none; border: 1px solid var(--border);
    background: var(--surface-1); padding: 7px 12px; border-radius: 8px; font-size: 12.5px;
  }
  a.btn:hover { border-color: var(--muted); }

  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(4, 1fr); margin-bottom: 14px; }
  .funnel { grid-template-columns: repeat(3, 1fr); margin-bottom: 22px; }
  .runtime { grid-template-columns: repeat(4, 1fr); margin-bottom: 22px; }
  .charts { grid-template-columns: 1fr 1fr; margin-bottom: 22px; }
  @media (max-width: 820px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .runtime { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
  .section-title { font-size: 13px; font-weight: 600; margin: 4px 0 12px; color: var(--text-2); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: 26px; font-weight: 650; margin-top: 6px; }
  .tile .value.pos { color: var(--good); }
  .tile .value.neg { color: var(--bad); }
  .tile .value.small { font-size: 20px; }

  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--text-2); }
  svg { width: 100%; height: auto; display: block; }
  .empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .03em; font-size: 11px; }
  td:first-child, th:first-child, td.l, th.l { text-align: left; }
  td.num { font-variant-numeric: tabular-nums; }
  td .pos { color: var(--good); }
  td .neg { color: var(--bad); }
  td a { color: var(--series); text-decoration: none; }
  td a:hover { text-decoration: underline; }

  /* chart marks */
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .area { fill: var(--series-soft); }
  .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { fill: var(--series); stroke: var(--surface-1); stroke-width: 2; }
  .dot:hover { r: 5; }
  .bar { fill: var(--series); }
  .bar.neg { fill: var(--bad); }
  .bar-label { fill: var(--text-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .bar-name { fill: var(--text-2); font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Arbitrage Bot — Stats</h1>
      <div class="sub" id="sub">loading…</div>
    </div>
    <a class="btn" href="/export/trades.csv">Download tax CSV</a>
  </header>

  <div class="grid kpis" id="kpis"></div>
  <div class="grid funnel" id="funnelRow"></div>

  <div class="section-title">Runtime health (this process)</div>
  <div class="grid runtime" id="runtimeRow"></div>

  <div class="grid charts">
    <div class="card">
      <h2>Cumulative net profit (USD)</h2>
      <div id="lineChart"></div>
    </div>
    <div class="card">
      <h2>Net profit by pair (USD)</h2>
      <div id="barChart"></div>
    </div>
  </div>

  <div class="card">
    <h2>Route performance (ranked by net USD)</h2>
    <div id="routesTable"></div>
  </div>

  <div class="card">
    <h2>Recent trades</h2>
    <div id="tradesTable"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const usd = (n) => (n < 0 ? '-$' : '$') + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const pct = (n) => (Number(n) * 100).toFixed(1) + '%'
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function tile(label, value, cls = '') {
  return `<div class="card tile"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`
}

function renderKPIs(s) {
  const net = s.totals.netProfitUsd || 0
  const netCls = net > 0 ? 'pos' : net < 0 ? 'neg' : ''
  const netStr = (net > 0 ? '▲ ' : net < 0 ? '▼ ' : '') + usd(net)
  $('kpis').innerHTML =
    tile('Net profit (USD est.)', netStr, netCls + ' ') +
    tile('Trades executed', s.totals.trades.toLocaleString()) +
    tile('Execution rate', pct(s.totals.executionRate), 'small') +
    tile('Gas spent (USD est.)', usd(s.totals.gasUsd), 'small')
}

function renderFunnel(s) {
  $('funnelRow').innerHTML =
    tile('Opportunities detected', (s.totals.detected + s.totals.executed).toLocaleString()) +
    tile('Rejected (unprofitable)', s.totals.rejected.toLocaleString()) +
    tile('Executed', s.totals.executed.toLocaleString())
}

// ---- Live runtime metrics (from /api/stats -> runtime) ----
function fmtUptime(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0))
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600)
  const m = Math.floor((sec % 3600) / 60), s = sec % 60
  if (d) return `${d}d ${h}h ${m}m`
  if (h) return `${h}h ${m}m ${s}s`
  if (m) return `${m}m ${s}s`
  return `${s}s`
}
function metricTile(label, value) {
  return `<div class="card tile"><div class="label">${label}</div><div class="value small">${value}</div></div>`
}
function renderRuntime(r) {
  if (!r) { $('runtimeRow').innerHTML = ''; return }
  const n = (v) => (Number(v) || 0).toLocaleString()
  $('runtimeRow').innerHTML =
    metricTile('Uptime', fmtUptime(r.uptimeSeconds)) +
    metricTile('Swaps received', n(r.swapsReceived)) +
    metricTile('Swaps evaluated', n(r.swapsEvaluated)) +
    metricTile('Opportunities found', n(r.opportunitiesFound)) +
    metricTile('Profitable', n(r.profitableOpportunities)) +
    metricTile('Trades executed', n(r.tradesExecuted)) +
    metricTile('Trades rejected', n(r.tradesRejected)) +
    metricTile('Avg eval time', (Number(r.avgEvalTimeMs) || 0) + ' ms') +
    metricTile('RPC requests', n(r.rpcRequests)) +
    metricTile('RPC retries', n(r.rpcRetries)) +
    metricTile('WS reconnects', n(r.wsReconnects))
}

// ---- Cumulative net profit line chart (single series) ----
function renderLine(daily) {
  const box = $('lineChart')
  if (!daily || daily.length === 0) { box.innerHTML = '<div class="empty">No trades logged yet.</div>'; return }

  let cum = 0
  const pts = daily.map((d) => { cum += Number(d.netUsd) || 0; return { date: d.date, y: cum } })

  const W = 520, H = 240, m = { t: 12, r: 14, b: 26, l: 52 }
  const iw = W - m.l - m.r, ih = H - m.t - m.b
  const ys = pts.map((p) => p.y)
  let min = Math.min(0, ...ys), max = Math.max(0, ...ys)
  if (min === max) max = min + 1
  const x = (i) => m.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw)
  const y = (v) => m.t + ih - ((v - min) / (max - min)) * ih

  // gridlines + y labels (5 ticks)
  let grid = '', line = '', area = '', dots = ''
  const ticks = 4
  for (let t = 0; t <= ticks; t++) {
    const v = min + (t / ticks) * (max - min)
    const yy = y(v)
    grid += `<line class="gridline" x1="${m.l}" y1="${yy.toFixed(1)}" x2="${W - m.r}" y2="${yy.toFixed(1)}"/>`
    grid += `<text class="axis-label" x="${m.l - 8}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${usd(v)}</text>`
  }
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ')
  line = `<path class="line" d="${path}"/>`
  const y0 = y(Math.max(min, 0))
  area = `<path class="area" d="${path} L${x(pts.length - 1).toFixed(1)},${y0.toFixed(1)} L${x(0).toFixed(1)},${y0.toFixed(1)} Z"/>`
  dots = pts.map((p, i) => `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="3.5"><title>${esc(p.date)}: ${usd(p.y)}</title></circle>`).join('')

  // a few x labels
  let xl = ''
  const step = Math.max(1, Math.ceil(pts.length / 5))
  for (let i = 0; i < pts.length; i += step) {
    xl += `<text class="axis-label" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(pts[i].date.slice(5))}</text>`
  }

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative net profit over time">${grid}${area}${line}${dots}${xl}</svg>`
}

// ---- Net profit by pair (horizontal bars) ----
function renderBars(perPair) {
  const box = $('barChart')
  const data = (perPair || []).filter((p) => Math.abs(p.netUsd) > 0).slice(0, 8)
  if (data.length === 0) { box.innerHTML = '<div class="empty">No trades logged yet.</div>'; return }

  const rowH = 26, gap = 6, W = 520, labelW = 120, valW = 70
  const H = data.length * (rowH + gap) + 6
  const iw = W - labelW - valW
  const maxAbs = Math.max(...data.map((d) => Math.abs(d.netUsd)), 1)

  let rows = ''
  data.forEach((d, i) => {
    const yy = i * (rowH + gap) + 3
    const w = Math.max(2, (Math.abs(d.netUsd) / maxAbs) * iw)
    const neg = d.netUsd < 0
    rows += `<text class="bar-name" x="0" y="${yy + rowH / 2 + 4}">${esc(d.pair)}</text>`
    rows += `<rect class="bar ${neg ? 'neg' : ''}" x="${labelW}" y="${yy}" width="${w.toFixed(1)}" height="${rowH}" rx="4"><title>${esc(d.pair)}: ${usd(d.netUsd)} (${d.trades} trades)</title></rect>`
    rows += `<text class="bar-label" x="${labelW + w + 6}" y="${yy + rowH / 2 + 4}">${usd(d.netUsd)}</text>`
  })
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net profit by pair">${rows}</svg>`
}

function renderRoutes(routes) {
  const box = $('routesTable')
  if (!routes || routes.length === 0) { box.innerHTML = '<div class="empty">No routes evaluated yet.</div>'; return }
  const rows = routes.slice(0, 15).map((r) => {
    const cls = r.netUsd > 0 ? 'pos' : r.netUsd < 0 ? 'neg' : ''
    return `<tr>
      <td class="l">${esc(r.route)}</td>
      <td class="l">${esc(r.pair)}</td>
      <td class="num">${(r.opportunities || 0).toLocaleString()}</td>
      <td class="num">${(r.profitable || 0).toLocaleString()}</td>
      <td class="num">${(r.executed || 0).toLocaleString()}</td>
      <td class="num">${r.executed ? pct(r.winRate) : '—'}</td>
      <td class="num"><span class="${cls}">${usd(r.netUsd)}</span></td>
      <td class="num">${(Number(r.avgRoi) || 0).toFixed(3)}%</td>
    </tr>`
  }).join('')
  box.innerHTML = `<table>
    <thead><tr>
      <th class="l">Route (buy → sell)</th><th class="l">Pair</th>
      <th>Opps</th><th>Profitable</th><th>Executed</th><th>Win%</th><th>Net (USD)</th><th>Avg ROI</th>
    </tr></thead>
    <tbody>${rows}</tbody></table>`
}

function renderTable(trades, meta) {
  const box = $('tradesTable')
  if (!trades || trades.length === 0) { box.innerHTML = '<div class="empty">No trades logged yet.</div>'; return }
  const txCell = (t) => {
    if (!t.txHash) return '—'
    const short = t.txHash.slice(0, 8) + '…'
    return meta && meta.explorerTx ? `<a href="${meta.explorerTx}${esc(t.txHash)}" target="_blank" rel="noopener">${short}</a>` : short
  }
  const rows = trades.map((t) => {
    const net = Number(t.netProfitUsd)
    const cls = net > 0 ? 'pos' : net < 0 ? 'neg' : ''
    return `<tr>
      <td class="l">${esc((t.time || '').replace('T', ' ').slice(0, 19))}</td>
      <td class="l">${esc(t.pair)}</td>
      <td class="l">${esc(t.buyOn)} → ${esc(t.sellOn)}</td>
      <td class="num">${esc(t.netProfit ?? '')} ${esc(t.base?.symbol ?? '')}</td>
      <td class="num"><span class="${cls}">${t.netProfitUsd != null ? usd(net) : '—'}</span></td>
      <td class="num">${t.roiPct != null ? Number(t.roiPct).toFixed(2) + '%' : '—'}</td>
      <td class="num">${txCell(t)}</td>
    </tr>`
  }).join('')
  box.innerHTML = `<table>
    <thead><tr>
      <th class="l">Time (UTC)</th><th class="l">Pair</th><th class="l">Direction</th>
      <th>Net (token)</th><th>Net (USD)</th><th>ROI</th><th>Tx</th>
    </tr></thead>
    <tbody>${rows}</tbody></table>`
}

async function load() {
  try {
    const [statsRes, tradesRes] = await Promise.all([fetch('/api/stats'), fetch('/api/trades?limit=50')])
    const stats = await statsRes.json()
    const trades = await tradesRes.json()

    const m = stats.meta || {}
    $('sub').innerHTML = `${esc(m.network || '')}<span class="dot">·</span>${m.isDeployed ? 'executing' : 'monitor only'}<span class="dot">·</span>updated ${new Date(stats.generatedAt).toLocaleTimeString()}`

    renderKPIs(stats)
    renderFunnel(stats)
    renderRuntime(stats.runtime)
    renderLine(stats.daily)
    renderBars(stats.perPair)
    renderRoutes(stats.routes)
    renderTable(trades, m)
  } catch (err) {
    $('sub').textContent = 'Error loading data: ' + err.message
  }
}

load()
setInterval(load, 15000)
</script>
</body>
</html>
